[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; Start the Unreal MCP server with the editor. .mcp.json and Scripts/lib/common.sh expect
; http://127.0.0.1:8000/mcp, so the port and path are pinned here instead of relying on engine
; defaults. Change all three places together.
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp

[/Script/UnrealEd.LevelEditorPlaySettings]
; Agents run PIE while a person works on the same machine: PIE never takes the mouse at start.
GameGetsMouseControl=False
